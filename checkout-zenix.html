<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATAN Checkout</title>

<script src="https://sdk.mercadopago.com/js/v2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
  padding:20px;
}

.container{
  max-width:600px;
  margin:auto;
  background:#111827;
  border-radius:24px;
  padding:30px;
  border:1px solid rgba(255,161,0,.4);
  box-shadow:0 0 40px rgba(255,161,0,.2);
}

h1{
  text-align:center;
  margin-top:0;
}

.plan{
  text-align:center;
  color:#FFA100;
  margin-bottom:25px;
  font-weight:900;
}

input{
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:12px;
  border:1px solid rgba(255,161,0,.3);
  background:#000;
  color:#fff;
  font-size:16px;
}

#paymentBrick_container{
  margin-top:25px;
}

</style>
</head>

<body>

<div class="container">

<h1>Contratar PATAN</h1>

<div class="plan" id="planTexto"></div>

<input type="text" id="nombre" placeholder="Nombre completo">

<input type="email" id="correo" placeholder="Correo electrónico">

<input type="tel" id="telefono" placeholder="WhatsApp">

<div id="paymentBrick_container"></div>

</div>

<script>

const mp = new MercadoPago(
  "TU_PUBLIC_KEY",
  {
    locale: "es-CL"
  }
);

const planes = {

  "1mes":{
    nombre:"PATAN 1 MES",
    precio:9990
  },

  "3meses":{
    nombre:"PATAN 3 MESES",
    precio:26990
  },

  "12meses":{
    nombre:"PATAN 12 MESES",
    precio:79990
  }

};

const params = new URLSearchParams(window.location.search);

const planElegido = params.get("plan") || "1mes";

const planData = planes[planElegido];

document.getElementById("planTexto").innerHTML =
planData.nombre + " · $" + planData.precio.toLocaleString("es-CL");

const bricksBuilder = mp.bricks();

bricksBuilder.create(
  "payment",
  "paymentBrick_container",
  {

    initialization: {

      amount: planData.precio,

      payer: {
        email: ""
      }

    },

    customization: {

      visual: {
        style: {
          theme: "dark"
        }
      }

    },

    callbacks: {

      onReady: () => {
        console.log("Brick listo");
      },

      onSubmit: async (formData) => {

        const nombre = document.getElementById("nombre").value;
        const correo = document.getElementById("correo").value;
        const telefono = document.getElementById("telefono").value;

        const response = await fetch("/api/process-payment", {

          method: "POST",

          headers: {
            "Content-Type":"application/json"
          },

          body: JSON.stringify({

            ...formData,

            description: planData.nombre,

            transaction_amount: planData.precio,

            cliente:{
              nombre,
              correo,
              telefono,
              plan:planData.nombre,
              precio:planData.precio
            }

          })

        });

        const result = await response.json();

        console.log(result);

        if(result.status === "approved"){

          window.location.href =
          "/gracias.html";

        }else{

          alert("Pago rechazado o pendiente");

        }

      },

      onError: (error) => {
        console.error(error);
      }

    }

  }
);

</script>

</body>
</html>
