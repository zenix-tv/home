<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATAN Checkout</title>

<script src="https://sdk.mercadopago.com/js/v2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,rgba(255,161,0,.22),#000 45%);
  color:#fff;
  min-height:100vh;
  padding:20px;
}

.container{
  width:100%;
  max-width:620px;
  margin:40px auto;
  background:#111827;
  border-radius:24px;
  padding:30px;
  border:1px solid rgba(255,161,0,.45);
  box-shadow:0 0 45px rgba(255,161,0,.22);
}

h1{text-align:center;margin-top:0;font-size:34px}
h1 span{color:#FFA100}

.plan{
  text-align:center;
  color:#FFA100;
  margin-bottom:25px;
  font-weight:900;
}

input{
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:12px;
  border:1px solid rgba(255,161,0,.35);
  background:#000;
  color:#fff;
  font-size:16px;
}

.checkout-btn{
  width:100%;
  margin-top:22px;
  padding:16px;
  background:#FFA100;
  color:#000;
  border:none;
  border-radius:14px;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
}

#cardPaymentBrick_container{
  display:none;
  margin-top:25px;
  background:#fff;
  border-radius:18px;
  padding:18px;
}

.status{
  margin-top:18px;
  padding:14px;
  border-radius:14px;
  text-align:center;
  display:none;
  font-weight:900;
}

.status.ok{display:block;background:#14532d;color:#fff}
.status.error{display:block;background:#7f1d1d;color:#fff}
.status.info{display:block;background:#1f2937;color:#FFA100}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#FFA100;
  text-decoration:none;
  font-weight:900;
}
</style>
</head>

<body>

<div class="container">

  <h1>Contratar <span>PATAN</span></h1>

  <div class="plan" id="planTexto"></div>

  <div id="datosBox">
    <input type="text" id="nombre" placeholder="Nombre completo">
    <input type="email" id="correo" placeholder="Correo electrónico">
    <input type="tel" id="telefono" placeholder="WhatsApp">

    <button id="continuarPago" class="checkout-btn">
      Cargar medio de pago
    </button>
  </div>

  <div id="cardPaymentBrick_container"></div>

  <div id="estadoPago" class="status"></div>

  <a href="/" class="back">← Volver a PATAN TV</a>

</div>

<script>
const PUBLIC_KEY = "TEST-8427339320127802-051220-d1b9a7a9801a6b1e251098f444b74d16-96548681";

const planes = {
  "1mes": { nombre:"PATAN 1 MES", precio:9990 },
  "3meses": { nombre:"PATAN 3 MESES", precio:26990 },
  "12meses": { nombre:"PATAN 12 MESES", precio:79990 }
};

const params = new URLSearchParams(window.location.search);
const planElegido = params.get("plan") || "1mes";
const planData = planes[planElegido] || planes["1mes"];

document.getElementById("planTexto").innerHTML =
  planData.nombre + " · $" + planData.precio.toLocaleString("es-CL");

function mostrarEstado(texto, tipo){
  const estado = document.getElementById("estadoPago");
  estado.textContent = texto;
  estado.className = "status " + tipo;
}

const mp = new MercadoPago(PUBLIC_KEY, { locale:"es-CL" });
const bricksBuilder = mp.bricks();

let brickCreado = false;
let cliente = {};

document.getElementById("continuarPago").addEventListener("click", async () => {

  const nombre = document.getElementById("nombre").value.trim();
  const correo = document.getElementById("correo").value.trim();
  const telefono = document.getElementById("telefono").value.trim();

  if(!nombre || !correo || !telefono){
    alert("Completa todos los campos.");
    return;
  }

  cliente = {
    nombre,
    correo,
    telefono,
    plan: planData.nombre,
    precio: planData.precio
  };

  localStorage.setItem("patan_cliente", JSON.stringify(cliente));

  document.getElementById("datosBox").style.display = "none";
  document.getElementById("cardPaymentBrick_container").style.display = "block";

  mostrarEstado("Ingresa tu tarjeta para activar PATAN.", "info");

  if(brickCreado) return;
  brickCreado = true;

  const settings = {
    initialization: {
      amount: planData.precio,
      payer: {
        email: correo
      }
    },

    callbacks: {
      onReady: () => {
        console.log("CardPayment Brick listo");
      },

      onSubmit: (cardFormData) => {
        mostrarEstado("Procesando pago seguro...", "info");

        return fetch("/api/process-payment", {
          method: "POST",
          headers: {
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            ...cardFormData,
            description: planData.nombre,
            transaction_amount: planData.precio,
            cliente
          })
        })
        .then(res => res.json())
        .then(result => {
          console.log(result);

          if(result.status === "approved"){
            mostrarEstado("✅ Pago aprobado correctamente.", "ok");

            localStorage.setItem("patan_pago_aprobado", JSON.stringify({
              payment_id: result.id,
              status: result.status,
              cliente,
              fecha: new Date().toISOString()
            }));

            setTimeout(() => {
              window.location.href = "/gracias.html";
            }, 1500);

          }else{
            mostrarEstado("❌ Pago no aprobado. Intenta con otra tarjeta.", "error");
          }
        })
        .catch(error => {
          console.error(error);
          mostrarEstado("❌ Error procesando pago.", "error");
        });
      },

      onError: (error) => {
        console.error(error);
        mostrarEstado("❌ Error cargando Mercado Pago.", "error");
      }
    }
  };

  await bricksBuilder.create(
    "cardPayment",
    "cardPaymentBrick_container",
    settings
  );

});
</script>

</body>
</html>
