<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contratar PATAN TV</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,rgba(255,161,0,.22),#000 45%);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.box{
  width:100%;
  max-width:520px;
  background:#111827;
  padding:30px;
  border-radius:24px;
  border:1px solid rgba(255,161,0,.5);
  box-shadow:0 0 50px rgba(255,161,0,.22);
}
h1{text-align:center;margin-top:0}
.plan-text{
  text-align:center;
  color:#FFA100;
  font-weight:900;
  margin-bottom:20px;
}
input{
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:12px;
  border:1px solid rgba(255,161,0,.35);
  background:#000;
  color:#fff;
  font-size:16px;
}
button{
  width:100%;
  margin-top:22px;
  padding:16px;
  background:#FFA100;
  color:#000;
  border:none;
  border-radius:14px;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h1>Contratar PATAN TV</h1>
  <div class="plan-text" id="planTexto"></div>

  <form id="checkoutForm">
    <input type="text" id="nombre" placeholder="Nombre completo" required>
    <input type="email" id="correo" placeholder="Correo electrónico" required>
    <input type="tel" id="telefono" placeholder="Teléfono / WhatsApp" required>

    <button type="submit">
      Guardar mis datos y pagar
    </button>
  </form>
</div>

<script>
const planes = {
  "1mes": {
    nombre: "1 Mes",
    link: "https://mpago.la/2EGd2SF"
  },
  "3meses": {
    nombre: "3 Meses",
    link: "https://mpago.la/1smZcyZ"
  },
  "12meses": {
    nombre: "12 Meses",
    link: "https://mpago.la/1m6HBAU"
  }
};

const params = new URLSearchParams(window.location.search);
const planElegido = params.get("plan") || "1mes";
const planData = planes[planElegido] || planes["1mes"];

document.getElementById("planTexto").textContent =
  "Plan seleccionado: " + planData.nombre;

document.getElementById("checkoutForm").addEventListener("submit", function(e){
  e.preventDefault();

  const nombre = document.getElementById("nombre").value.trim();
  const correo = document.getElementById("correo").value.trim();
  const telefono = document.getElementById("telefono").value.trim();

  if(!nombre || !correo || !telefono){
    alert("Completa todos los campos antes de pagar.");
    return;
  }

  const mensaje = `😎 Ya falta poco para convertirte en Patán Premium

👤 Cliente: ${nombre}
📧 Correo: ${correo}
📱 Teléfono: ${telefono}
📦 Plan: ${planData.nombre}

💰 Estado: Pendiente de pago

👉 Cuando confirme pago, generar acceso.`;

  localStorage.setItem("patan_cliente", JSON.stringify({
    nombre,
    correo,
    telefono,
    plan: planData.nombre
  }));

  const miWhatsApp = "56964180558";
  const waURL = "https://wa.me/" + miWhatsApp + "?text=" + encodeURIComponent(mensaje);

  window.open(waURL, "_blank");

  setTimeout(function(){
    window.location.href = planData.link;
  }, 1200);
});
</script>

</body>
</html>
