<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATANTV Checkout</title>

<script src="https://sdk.mercadopago.com/js/v2"></script>
<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,rgba(255,161,0,.24),#000 48%);
  color:#fff;
  min-height:100vh;
  padding:20px;
}

.container{
  width:100%;
  max-width:620px;
  margin:55px auto;
  background:#111827;
  border-radius:24px;
  padding:34px 30px 30px;
  border:1px solid rgba(255,161,0,.45);
  box-shadow:0 0 45px rgba(255,161,0,.22);
  position:relative;
  overflow:visible;
}

.checkout-dog{
  position:absolute;
  top:-52px;
  right:-24px;
  width:105px;
  filter:drop-shadow(0 0 18px rgba(255,161,0,.75));
  z-index:5;
}

h1{
  text-align:center;
  margin:0;
  font-size:34px;
  line-height:1.1;
}

h1 span{color:#FFA100}

.checkout-sub{
  text-align:center;
  color:rgba(255,255,255,.82);
  font-weight:700;
  line-height:1.4;
  margin:14px 0 16px;
}

.secure-box{
  background:rgba(255,161,0,.10);
  border:1px solid rgba(255,161,0,.35);
  color:#FFA100;
  padding:13px;
  border-radius:14px;
  text-align:center;
  font-weight:900;
  font-size:14px;
  margin-bottom:20px;
}

.plan{
  text-align:center;
  color:#FFA100;
  margin:22px 0 26px;
  font-weight:900;
  font-size:26px;
  letter-spacing:.5px;
  text-shadow:0 0 14px rgba(255,161,0,.45);
}

input{
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:12px;
  border:1px solid rgba(255,161,0,.35);
  background:#000;
  color:#fff;
  font-size:16px;
}

.checkout-btn{
  width:100%;
  margin-top:22px;
  padding:16px;
  background:#FFA100;
  color:#000;
  border:none;
  border-radius:14px;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
}

#cardPaymentBrick_container{
  display:none;
  margin-top:25px;
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 0 28px rgba(255,161,0,.25);
}

.status{
  margin-top:18px;
  padding:14px;
  border-radius:14px;
  text-align:center;
  display:none;
  font-weight:900;
}

.status.ok{display:block;background:#14532d;color:#fff}
.status.error{display:block;background:#7f1d1d;color:#fff}
.status.info{display:block;background:#1f2937;color:#FFA100}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#FFA100;
  text-decoration:none;
  font-weight:900;
}

@media(max-width:600px){
  body{
    padding:16px;
  }

  .container{
    margin:48px auto 25px;
    padding:30px 18px 24px;
  }

  h1{
    font-size:27px;
  }

  .checkout-dog{
    top:-5px;
    left:4px;
    width:78px;
  }

  .secure-box{
    font-size:13px;
  }

  .plan{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <img src="file_00000000689871f5bd4fa34f49f6552b.png" class="checkout-dog" alt="Patan TV">

  <h1>Estás a pasos de ser un <span>Patán Premium</span></h1>

  <p class="checkout-sub">
    Tranquilo, Patán 😎. Tu pago se procesa de forma segura con Mercado Pago.
  </p>

  <div class="secure-box">
    🔒 Sitio seguro con SSL · Pago protegido por Mercado Pago · Tus datos están resguardados
  </div>

  <div class="plan" id="planTexto"></div>

  <div id="datosBox">
    <input type="text" id="nombre" placeholder="Nombre completo">
    <input type="email" id="correo" placeholder="Correo electrónico">
    <input type="tel" id="telefono" placeholder="WhatsApp">

    <button id="continuarPago" class="checkout-btn">
      Cargar medio de pago
    </button>
  </div>

  <div id="cardPaymentBrick_container"></div>

  <div id="estadoPago" class="status"></div>

  <a href="/" class="back">← Volver a PATAN TV</a>

</div>

<script>
const PUBLIC_KEY = "APP_USR-bd1e0065-e657-4ebc-bb42-c3797ab6c953";

const planes = {
  "1mes": { nombre:"1 MES INICIAL", precio:9990 },
  "3meses": { nombre:"3 MESES TOP", precio:26990 },
  "12meses": { nombre:"12 MESES PATANLOVERS", precio:79990 }
};

const params = new URLSearchParams(window.location.search);
const planElegido = params.get("plan") || "1mes";
const planData = planes[planElegido] || planes["1mes"];

document.getElementById("planTexto").innerHTML =
  planData.nombre + " · $" + planData.precio.toLocaleString("es-CL");

function mostrarEstado(texto, tipo){
  const estado = document.getElementById("estadoPago");
  estado.textContent = texto;
  estado.className = "status " + tipo;
}

const mp = new MercadoPago(PUBLIC_KEY, { locale:"es-CL" });
const bricksBuilder = mp.bricks();

let brickCreado = false;
let cliente = {};

document.getElementById("continuarPago").addEventListener("click", async () => {

  const nombre = document.getElementById("nombre").value.trim();
  const correo = document.getElementById("correo").value.trim();
  const telefono = document.getElementById("telefono").value.trim();

  if(!nombre || !correo || !telefono){
    alert("Completa todos los campos.");
    return;
  }

  cliente = {
    nombre,
    correo,
    telefono,
    plan: planData.nombre,
    precio: planData.precio
  };

  localStorage.setItem("patan_cliente", JSON.stringify(cliente));

  document.getElementById("datosBox").style.display = "none";
  document.getElementById("cardPaymentBrick_container").style.display = "block";

  mostrarEstado("Ingresa tu tarjeta para activar PATAN.", "info");

  if(brickCreado) return;
  brickCreado = true;

  const settings = {
    initialization: {
      amount: planData.precio,
      payer: {
        email: correo
      }
    },

    callbacks: {
      onReady: () => {
        console.log("CardPayment Brick listo");
      },

      onSubmit: (cardFormData) => {
        mostrarEstado("Procesando pago seguro...", "info");

        return fetch("/api/process-payment", {
          method: "POST",
          headers: {
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            ...cardFormData,
            description: planData.nombre,
            transaction_amount: planData.precio,
            cliente
          })
        })
        .then(res => res.json())
.then(result => {
  console.log(result);

  if(result.status === "approved"){
    mostrarEstado("✅ ¡Pago aprobado! Bienvenido al lado Patán del streaming. Estamos preparando tus accesos.", "ok");

    localStorage.setItem("patan_pago_aprobado", JSON.stringify({
      payment_id: result.id,
      status: result.status,
      cliente,
      fecha: new Date().toISOString()
    }));

    setTimeout(() => {
      window.location.href = "/gracias.html";
    }, 1800);

else if(result.status === "rejected"){

  mostrarEstado("❌ Pago rechazado. Redirigiendo...", "error");

  setTimeout(() => {
    window.location.href = "/rechazado.html";
  }, 1500);

}

  } else if(result.status === "pending"){
    mostrarEstado("⏳ Pago pendiente. Mercado Pago está revisando la operación. Te avisaremos cuando se confirme.", "info");

  } else {
    mostrarEstado("⚠️ No pudimos confirmar el pago. Intenta nuevamente o contacta soporte PATAN TV.", "error");
  }
})

  await bricksBuilder.create(
    "cardPayment",
    "cardPaymentBrick_container",
    settings
  );

});
</script>

</body>
</html>
