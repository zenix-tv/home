<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login PATAN TV</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,Helvetica,sans-serif;
  background:
  radial-gradient(circle at top,
  rgba(255,161,0,.28),
  #000 55%);
  color:#fff;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#111827;
  border-radius:24px;
  padding:35px;
  border:1px solid rgba(255,161,0,.45);
  box-shadow:0 0 45px rgba(255,161,0,.25);
}

h1{
  margin:0;
  text-align:center;
  font-size:34px;
}

h1 span{
  color:#FFA100;
}

.sub{
  text-align:center;
  margin-top:12px;
  color:#ccc;
  font-weight:700;
}

input{
  width:100%;
  margin-top:25px;
  padding:15px;
  border-radius:14px;
  border:1px solid rgba(255,161,0,.35);
  background:#000;
  color:#fff;
  font-size:17px;
}

button{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#FFA100;
  color:#000;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
}

.error{
  margin-top:15px;
  text-align:center;
  color:#ff8a8a;
  font-weight:900;
  display:none;
}

</style>
</head>

<body>

<div class="login-box">

  <h1>Admin <span>PATAN TV</span></h1>

  <div class="sub">
    Acceso privado del panel comercial
  </div>

 <input
  type="email"
  id="email"
  placeholder="Correo administrador"
>

<input
  type="password"
  id="password"
  placeholder="Contraseña"
>

  <button onclick="entrar()">
    Entrar al Panel
  </button>

<div class="error" id="error">
  Correo o contraseña incorrectos
</div>

</div>

 <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgK8LvJS69gyEhiUL7U-6AQoKBwyq-Pfs",
  authDomain: "patan-tv.firebaseapp.com",
  projectId: "patan-tv",
  storageBucket: "patan-tv.firebasestorage.app",
  messagingSenderId: "400945997953",
  appId: "1:400945997953:web:c5721123411dad95c08580"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.entrar = async function(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value.trim();

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    localStorage.setItem(
      "patan_admin",
      "firebase"
    );

    window.location.href =
    "/admin-patan.html";

  }catch(e){

    document.getElementById("error").style.display =
    "block";

  }

};

document
.getElementById("password")
.addEventListener("keydown", function(e){

  if(e.key === "Enter"){
    entrar();
  }

});

</script>

</body>
</html>
