<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Cliente PATAN TV</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    .hero {
      min-height: 100vh;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.25), #000 85%),
        radial-gradient(circle at top, rgba(255,161,0,.35), transparent 38%),
        url("football-hero.jpg") center/cover no-repeat;
    }

    .card {
      width: min(720px, 100%);
      background: rgba(5,10,18,.92);
      border: 1px solid rgba(255,161,0,.45);
      border-radius: 32px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 0 70px rgba(255,161,0,.35);
      backdrop-filter: blur(14px);
    }

    .logo {
      font-size: clamp(38px, 8vw, 72px);
      font-weight: 900;
      margin-bottom: 10px;
    }

    .logo span {
      color: #FFA100;
    }

    .badge {
      display: inline-block;
      background: #FFA100;
      color: #000;
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 900;
      margin: 16px 0 24px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 58px);
      margin: 0 0 12px;
      line-height: 1;
    }

    .sub {
      color: rgba(255,255,255,.78);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .data {
      display: grid;
      gap: 14px;
      margin: 28px 0;
      text-align: left;
    }

    .row {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,161,0,.25);
      border-radius: 18px;
      padding: 16px;
    }

    .row small {
      display: block;
      color: #FFA100;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .row strong {
      font-size: 20px;
      word-break: break-word;
    }

    .btn {
      display: inline-block;
      margin-top: 18px;
      background: #FFA100;
      color: #000;
      padding: 17px 34px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 0 45px rgba(255,161,0,.75);
    }

    .note {
      margin-top: 24px;
      color: rgba(255,255,255,.75);
      line-height: 1.6;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 16px;
      }

      .card {
        padding: 24px 18px;
        border-radius: 24px;
      }

      .row strong {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<section class="hero">
  <div class="card">
    <div class="logo">PATAN<span>TV</span></div>

    <div class="badge">ACCESO ACTIVADO ✅</div>

    <h1>Bienvenido, <span id="cliente">Cliente</span></h1>

    <p class="sub">
      😎 Tu acceso ya está listo, Patán
    </p>

    <div class="data">
      <div class="row">
        <small>PLAN CONTRATADO</small>
        <strong id="plan">---</strong>
      </div>

      <div class="row">
        <small>USUARIO</small>
        <strong id="usuario">---</strong>
      </div>

      <div class="row">
        <small>PASSWORD</small>
        <strong id="password">---</strong>
      </div>

      <div class="row">
        <small>LINK M3U</small>
        <strong id="m3u">---</strong>
      </div>
    </div>

    <a id="btnM3U" class="btn" href="#" target="_blank">Abrir Link M3U</a>

    <p class="note">
      Recomendación: usa una conexión estable de internet y abre el servicio desde tu app compatible.
      <br>
      Soporte PATAN TV disponible para ayudarte.
    </p>
  </div>
</section>

<script>
  const params = new URLSearchParams(window.location.search);

  const cliente = params.get("cliente") || "Cliente";
  const plan = params.get("plan") || "---";
  const usuario = params.get("usuario") || "---";
  const password = params.get("password") || "---";
  const m3u = params.get("m3u") || "#";

  document.getElementById("cliente").textContent = cliente;
  document.getElementById("plan").textContent = plan;
  document.getElementById("usuario").textContent = usuario;
  document.getElementById("password").textContent = password;
  document.getElementById("m3u").textContent = m3u;
  document.getElementById("btnM3U").href = m3u;
</script>

</body>
</html>
