<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago aprobado - PATAN TV</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:radial-gradient(circle at top,rgba(255,161,0,.25),#000 50%);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:620px;
  background:#111827;
  border:1px solid rgba(255,161,0,.45);
  border-radius:26px;
  padding:34px;
  text-align:center;
  box-shadow:0 0 50px rgba(255,161,0,.25);
}

.card{
  position:relative;
  overflow:visible;
}

.dog{
  position:absolute;
  top:18px;
  left:115px;
  width:88px;
  margin:0;
  z-index:5;
  filter:drop-shadow(0 0 18px rgba(255,161,0,.75));
}

h1{
  font-size:36px;
  margin:0 0 12px;
}

h1 span{
  color:#FFA100;
}

p{
  color:rgba(255,255,255,.82);
  font-size:18px;
  line-height:1.5;
}

.box{
  margin-top:22px;
  padding:18px;
  border-radius:18px;
  background:rgba(255,161,0,.10);
  border:1px solid rgba(255,161,0,.35);
  color:#FFA100;
  font-weight:900;
}

a{
  display:inline-block;
  margin-top:24px;
  background:#FFA100;
  color:#000;
  padding:15px 22px;
  border-radius:16px;
  text-decoration:none;
  font-weight:900;
}

@media(max-width:600px){

  .dog{
    top:12px;
    left:23px;
    width:70px;
  }

}

  h1{
    margin-top:20px;
  }
}  

  
</style>
</head>

<body>

<div class="card">
  <img src="file_00000000689871f5bd4fa34f49f6552b.png" class="dog" alt="Patan TV">

  <h1>¡Pago aprobado, <span>Patán Premium!</span></h1>

  <p>
    Tu compra fue recibida correctamente.  
    Estamos preparando tus credenciales de acceso.
  </p>

  <div class="box">
    📲 Te enviaremos tu usuario, contraseña y link M3U a tu WhatsApp y correo registrado.
  </div>

  <p>
    Si no recibes tus datos en algunos minutos, escríbenos a soporte PATAN TV.
  </p>

  <a href="/">Volver a PATAN TV</a>
</div>

</body>
</html>
