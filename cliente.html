<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Cliente ZENIX TV</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,rgba(255,161,0,.25),#000 45%);
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}
.card{
  width:100%;
  max-width:720px;
  background:rgba(8,12,20,.94);
  border:1px solid rgba(255,161,0,.35);
  border-radius:30px;
  padding:32px;
  box-shadow:0 0 60px rgba(255,161,0,.28);
}
.logo{
  text-align:center;
  font-size:46px;
  font-weight:900;
  margin-bottom:8px;
}
.logo span{color:#FFA100}
.badge{
  text-align:center;
  color:#FFA100;
  font-weight:900;
  margin-bottom:28px;
}
.item{
  background:#07111d;
  border:1px solid rgba(255,161,0,.25);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}
.item label{
  display:block;
  color:#FFA100;
  font-weight:900;
  margin-bottom:7px;
}
.item div{
  word-break:break-all;
  font-size:17px;
}
button,a{
  width:100%;
  display:block;
  text-align:center;
  margin-top:14px;
  padding:16px;
  border-radius:18px;
  border:none;
  text-decoration:none;
  background:#FFA100;
  color:#000;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 0 30px rgba(255,161,0,.55);
}
.note{
  margin-top:22px;
  color:rgba(255,255,255,.75);
  line-height:1.5;
  text-align:center;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">ZENIX<span>TV</span></div>
  <div class="badge">ACCESO PREMIUM ACTIVADO ✅</div>

  <div class="item">
    <label>Cliente</label>
    <div id="nombre"></div>
  </div>

  <div class="item">
    <label>Plan contratado</label>
    <div id="plan"></div>
  </div>

  <div class="item">
    <label>Usuario</label>
    <div id="usuario"></div>
  </div>

  <div class="item">
    <label>Password</label>
    <div id="password"></div>
  </div>

  <div class="item">
    <label>Link M3U</label>
    <div id="m3u"></div>
  </div>

  <button onclick="copiarM3U()">Copiar Link M3U</button>
  <a id="soporte" target="_blank">Contactar Soporte ZENIX</a>

  <p class="note">
    Usa una conexión estable de internet y abre tu acceso desde una app compatible.
    Si necesitas ayuda, contacta a soporte ZENIX TV.
  </p>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const nombre = params.get("nombre") || "Cliente";
const plan = params.get("plan") || "Plan ZENIX TV";
const usuario = params.get("usuario") || "";
const password = params.get("password") || "";
const m3u = params.get("m3u") || "";

document.getElementById("nombre").textContent = nombre;
document.getElementById("plan").textContent = plan;
document.getElementById("usuario").textContent = usuario;
document.getElementById("password").textContent = password;
document.getElementById("m3u").textContent = m3u;

function copiarM3U(){
  navigator.clipboard.writeText(m3u);
  alert("Link M3U copiado ✅");
}

document.getElementById("soporte").href =
  "https://wa.me/56964180558?text=Hola%20ZENIX%20TV,%20necesito%20ayuda%20con%20mi%20acceso";
  
<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("clienteNombre").textContent = params.get("nombre") || "Cliente";
document.getElementById("clientePlan").textContent = params.get("plan") || "";
document.getElementById("clienteUsuario").textContent = params.get("user") || "";
document.getElementById("clientePassword").textContent = params.get("pass") || "";
document.getElementById("clienteM3U").textContent = params.get("m3u") || "";
</script>
</body>
</html>
