<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin PATAN TV</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#050b16;
  color:#fff;
  padding:24px;
}

h1{
  text-align:center;
  color:#FFA100;
}

.panel{
  max-width:1200px;
  margin:auto;
}

.card{
  background:#111827;
  border:1px solid rgba(255,161,0,.35);
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 0 25px rgba(255,161,0,.12);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.label{
  color:#FFA100;
  font-weight:900;
}

input{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid rgba(255,161,0,.35);
  background:#000;
  color:#fff;
}

button,a.btn{
  display:inline-block;
  margin-top:12px;
  padding:12px 16px;
  border-radius:12px;
  background:#FFA100;
  color:#000;
  border:none;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-weight:900;
}

.pendiente{background:#7c2d12;color:#fff}
.activado{background:#14532d;color:#fff}

.small{
  color:#ccc;
  font-size:14px;
}
</style>
</head>

<body>

<div class="panel">
  <h1>Panel Admin PATAN TV</h1>
  <p style="text-align:center;color:#ccc;">Clientes pagados y pendientes de activación</p>

  <div id="clientes"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_APIKEY",
  authDomain: "patan-tv.firebaseapp.com",
  projectId: "patan-tv",
  storageBucket: "patan-tv.firebasestorage.app",
  messagingSenderId: "400945997953",
  appId: "1:400945997953:web:c5721123411dad95c08580"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const contenedor = document.getElementById("clientes");

async function cargarClientes(){
  contenedor.innerHTML = "Cargando clientes...";

  const querySnapshot = await getDocs(collection(db, "clientes"));
  contenedor.innerHTML = "";

  querySnapshot.forEach((documento) => {
    const c = documento.data();
    const id = documento.id;

    const estado = c.estado_activacion || "pendiente";

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="grid">
        <div><div class="label">Cliente</div>${c.nombre || ""}</div>
        <div><div class="label">Correo</div>${c.correo || ""}</div>
        <div><div class="label">WhatsApp</div>${c.whatsapp || ""}</div>
        <div><div class="label">Plan</div>${c.plan || ""}</div>
        <div><div class="label">Precio</div>$${Number(c.precio || 0).toLocaleString("es-CL")}</div>
        <div><div class="label">Pago</div>${c.estado_pago || ""}</div>
        <div><div class="label">Estado</div><span class="status ${estado}">${estado}</span></div>
      </div>

      <hr style="border-color:rgba(255,255,255,.1);margin:18px 0">

      <div class="grid">
        <div>
          <div class="label">Usuario IPTV</div>
          <input id="usuario-${id}" placeholder="Usuario">
        </div>

        <div>
          <div class="label">Contraseña IPTV</div>
          <input id="password-${id}" placeholder="Contraseña">
        </div>

        <div>
          <div class="label">Link M3U</div>
          <input id="m3u-${id}" placeholder="Link M3U">
        </div>
      </div>

      <button onclick="activarCliente('${id}')">Guardar acceso</button>
      <a class="btn" id="whatsapp-${id}" target="_blank">Enviar por WhatsApp</a>

      <p class="small">Payment ID: ${c.payment_id || ""}</p>
    `;

    contenedor.appendChild(div);

    if(c.usuario_iptv) document.getElementById("usuario-" + id).value = c.usuario_iptv;
    if(c.password_iptv) document.getElementById("password-" + id).value = c.password_iptv;
    if(c.m3u) document.getElementById("m3u-" + id).value = c.m3u;

    actualizarWhatsApp(id, c);
  });
}

window.activarCliente = async function(id){
  const usuario = document.getElementById("usuario-" + id).value.trim();
  const password = document.getElementById("password-" + id).value.trim();
  const m3u = document.getElementById("m3u-" + id).value.trim();

  if(!usuario || !password || !m3u){
    alert("Completa usuario, contraseña y M3U.");
    return;
  }

  await updateDoc(doc(db, "clientes", id), {
    usuario_iptv: usuario,
    password_iptv: password,
    m3u: m3u,
    estado_activacion: "activado",
    fecha_activacion: new Date().toISOString()
  });

  alert("Cliente activado correctamente.");
  cargarClientes();
}

function actualizarWhatsApp(id, c){
  const btn = document.getElementById("whatsapp-" + id);
  if(!btn) return;

  btn.addEventListener("click", () => {
    const usuario = document.getElementById("usuario-" + id).value.trim();
    const password = document.getElementById("password-" + id).value.trim();
    const m3u = document.getElementById("m3u-" + id).value.trim();

    const accesoURL =
      "https://www.patan.tv/acceso-patan.html?nombre=" + encodeURIComponent(c.nombre || "") +
      "&plan=" + encodeURIComponent(c.plan || "") +
      "&usuario=" + encodeURIComponent(usuario) +
      "&password=" + encodeURIComponent(password) +
      "&m3u=" + encodeURIComponent(m3u);

    const mensaje =
`Hola ${c.nombre || "Patán Premium"} 😎🔥

Tu cuenta PATAN TV ya está activa.

📦 Plan: ${c.plan || ""}
👤 Usuario: ${usuario}
🔑 Contraseña: ${password}

👉 Tu hoja de acceso:
${accesoURL}

Guarda este enlace. Ahí tienes tus datos, apps recomendadas e instrucciones.`;

    btn.href = "https://wa.me/56" + String(c.whatsapp || "").replace(/\D/g,"") + "?text=" + encodeURIComponent(mensaje);
  });
}

cargarClientes();
</script>

</body>
</html>
