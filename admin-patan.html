<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin PATAN TV</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050b16;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding:24px;
}

h1{text-align:center;color:#FFA100}

.panel{max-width:1300px;margin:auto}

.topbar{
  display:flex;
  gap:12px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.search{flex:1;min-width:240px}

.search input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,161,0,.35);
  background:#111827;
  color:#fff;
}

.card{
  background:#111827;
  border:1px solid rgba(255,161,0,.35);
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 0 25px rgba(255,161,0,.12);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.label{color:#FFA100;font-weight:900}

input{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid rgba(255,161,0,.35);
  background:#000;
  color:#fff;
}

button,a.btn{
  display:inline-block;
  margin-top:12px;
  padding:12px 16px;
  border-radius:12px;
  background:#FFA100;
  color:#000;
  border:none;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  margin-right:8px;
}

.delete{background:#7f1d1d;color:#fff}
.contactado{background:#14532d;color:#fff}
.access{background:#2563eb;color:#fff}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-weight:900;
}

.pendiente{background:#7c2d12;color:#fff}
.activado{background:#14532d;color:#fff}
.lead{background:#1d4ed8;color:#fff}
.contactado-status{background:#166534;color:#fff}
.approved{background:#14532d;color:#fff}

.small{color:#ccc;font-size:14px;word-break:break-word}

hr{
  border-color:rgba(255,255,255,.1);
  margin:18px 0;
}
</style>
</head>

<body>

<script>
if(localStorage.getItem("patan_admin") !== "ok"){
  window.location.href = "/admin-login.html";
}
</script>

<div class="panel">

<h1>Panel Admin PATAN TV</h1>

<div class="topbar">
  <div class="search">
    <input type="text" id="busqueda" placeholder="Buscar cliente, correo o WhatsApp...">
  </div>

  <div style="width:240px">
    <select id="filtro">
      <option value="todos">Todos</option>
      <option value="lead">Leads</option>
      <option value="approved">Pagados</option>
      <option value="activado">Activados</option>
      <option value="pendiente">Pendientes</option>
      <option value="contactado">Contactados</option>
    </select>
  </div>
</div>

<div id="clientes"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgK8LvJS69gyEhiUL7U-6AQoKBwyq-Pfs",
  authDomain: "patan-tv.firebaseapp.com",
  projectId: "patan-tv",
  storageBucket: "patan-tv.firebasestorage.app",
  messagingSenderId: "400945997953",
  appId: "1:400945997953:web:c5721123411dad95c08580"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const contenedor = document.getElementById("clientes");
let TODOS = [];

function limpiarTelefonoWhatsApp(numero){
  let tel = String(numero || "").replace(/\D/g,"");

  if(tel.startsWith("56")) return tel;
  if(tel.startsWith("34")) return tel;

  if(tel.length === 9 && tel.startsWith("9")){
    return "56" + tel;
  }

  return tel;
}

function abrirWhatsAppBusiness(numero, mensaje){
  const telefonoFinal = limpiarTelefonoWhatsApp(numero);

  if(!telefonoFinal){
    alert("Este cliente no tiene WhatsApp válido.");
    return;
  }

  const url =
  `https://api.whatsapp.com/send?phone=${telefonoFinal}&text=${encodeURIComponent(mensaje)}#Intent;scheme=smsto;package=com.whatsapp.w4b;end`;
window.open(url, "_blank");
}

async function cargar(){

  TODOS = [];

  const clientesSnap =
  await getDocs(collection(db,"clientes"));

  clientesSnap.forEach(docu => {

    TODOS.push({
      id:docu.id,
      tipo:"cliente",
      ...docu.data()
    });

  });

  const leadsSnap =
  await getDocs(collection(db,"leads"));

  leadsSnap.forEach(docu => {

    TODOS.push({
      id:docu.id,
      tipo:"lead",
      ...docu.data()
    });

  });

  render();

}

function render(){

  const texto =
  document.getElementById("busqueda")
  .value
  .toLowerCase();

  const filtro =
  document.getElementById("filtro")
  .value;

  contenedor.innerHTML = "";

  TODOS
  .filter(c => {

    const matchTexto =
    (c.nombre || "")
    .toLowerCase()
    .includes(texto)

    ||

    (c.correo || "")
    .toLowerCase()
    .includes(texto)

    ||

    (c.whatsapp || "")
    .includes(texto);

    let matchFiltro = true;

    if(filtro === "lead"){
      matchFiltro = c.tipo === "lead";
    }

    if(filtro === "approved"){
      matchFiltro = c.estado_pago === "approved";
    }

    if(filtro === "activado"){
      matchFiltro = c.estado_activacion === "activado";
    }

    if(filtro === "pendiente"){
      matchFiltro = c.estado_activacion === "pendiente";
    }

    return matchTexto && matchFiltro;

  })

  .forEach(c => {

    const estado =
    c.estado_activacion || c.estado || "lead";

    const div =
    document.createElement("div");

    div.className = "card";

    div.innerHTML = `

<div class="grid">

<div>
<div class="label">Cliente</div>
${c.nombre || ""}
</div>

<div>
<div class="label">Correo</div>
${c.correo || ""}
</div>

<div>
<div class="label">WhatsApp</div>
${c.whatsapp || ""}
</div>

<div>
<div class="label">Plan</div>
${c.plan || ""}
</div>

<div>
<div class="label">Precio</div>
$${Number(c.precio || 0)
.toLocaleString("es-CL")}
</div>

<div>
<div class="label">Estado</div>

<span class="status ${estado}">
${estado}
</span>

</div>

</div>

<hr>

<div class="grid">

<div>
<div class="label">Usuario IPTV</div>
<input id="u-${c.id}" value="${c.usuario_iptv || ""}">
</div>

<div>
<div class="label">Password IPTV</div>
<input id="p-${c.id}" value="${c.password_iptv || ""}">
</div>

<div>
<div class="label">Link M3U</div>
<input id="m-${c.id}" value="${c.m3u || ""}">
</div>

</div>

<button onclick="activar('${c.id}')">
Guardar acceso
</button>

<button
class="contactado"
onclick="contactado('${c.id}','${c.tipo}')"
>
Marcar contactado
</button>
${c.tipo === "lead" ? `

<button
onclick="convertirCliente('${c.id}')"
>
Convertir a Cliente
</button>

` : ""}

${c.tipo === "lead" ? `

<a
class="btn"
target="_blank"
href="https://api.whatsapp.com/send?phone=56${String(c.whatsapp || "").replace(/\D/g,'')}&text=${encodeURIComponent(`Hola ${c.nombre || ""} 😎

Soy de PATAN TV.

Vimos que mostraste interés en el plan ${c.plan || ""}.

¿Te ayudo a activar tu cuenta premium? 🔥`)}#Intent;scheme=smsto;package=com.whatsapp.w4b;end"
>
WhatsApp Lead
</a>

` : `

<button
onclick="enviarAcceso('${c.id}')"
>
Enviar Hoja de Acceso
</button>

`}

<button
class="delete"
onclick="eliminar('${c.id}','${c.tipo}')"
>
Eliminar
</button>

<p class="small">
${c.payment_id || ""}
</p>

`;

    contenedor.appendChild(div);

  });

}

window.activar = async function(id){

window.enviarAcceso = function(id){

  const c = TODOS.find(x => x.id === id);

  if(!c){
    alert("No encontré este cliente.");
    return;
  }

  const usuario =
  document.getElementById("u-"+id)
  ?.value
  .trim()
  || c.usuario_iptv
  || "";

  const password =
  document.getElementById("p-"+id)
  ?.value
  .trim()
  || c.password_iptv
  || "";

  const m3u =
  document.getElementById("m-"+id)
  ?.value
  .trim()
  || c.m3u
  || "";

  if(!usuario || !password || !m3u){
    alert("Primero guarda usuario, contraseña y M3U.");
    return;
  }

  const accesoURL =
  "https://www.patan.tv/acceso-patan.html?nombre=" +
  encodeURIComponent(c.nombre || "") +
  "&plan=" +
  encodeURIComponent(c.plan || "") +
  "&usuario=" +
  encodeURIComponent(usuario) +
  "&password=" +
  encodeURIComponent(password) +
  "&m3u=" +
  encodeURIComponent(m3u);

  const mensaje =
`Hola ${c.nombre || "Patán Premium"} 😎🔥

🎉 ¡Bienvenido a PATAN TV!

Tu cuenta ya está activa y lista para disfrutar.

📦 Plan contratado: ${c.plan || ""}
👤 Usuario: ${usuario}
🔑 Contraseña: ${password}

🔗 Link M3U:
${m3u}

📄 Tu hoja de acceso premium:
${accesoURL}

Guarda esta página. Ahí encontrarás tus datos, apps recomendadas e instrucciones de instalación.

Si necesitas ayuda, estamos para apoyarte.
PATAN TV 🐶🔥`;

  const telefono =
  String(c.whatsapp || "")
  .replace(/\D/g,"");

  const telefonoFinal =
  telefono.startsWith("56")
  ? telefono
  : "56" + telefono;

  window.open(
    "https://wa.me/" +
    telefonoFinal +
    "?text=" +
    encodeURIComponent(mensaje),
    "_blank"
  );

}  
  const usuario =
  document.getElementById("u-"+id)
  .value
  .trim();

  const password =
  document.getElementById("p-"+id)
  .value
  .trim();

  const m3u =
  document.getElementById("m-"+id)
  .value
  .trim();

  await updateDoc(
    doc(db,"clientes",id),
    {
      usuario_iptv:usuario,
      password_iptv:password,
      m3u:m3u,
      estado_activacion:"activado"
    }
  );

  alert("Cliente activado");

  cargar();

}

window.contactado = async function(id,tipo){
window.convertirCliente = async function(id){

  const lead =
  TODOS.find(x => x.id === id);

  if(!lead) return;

  await addDoc(
    collection(db,"clientes"),
    {
      nombre: lead.nombre || "",
      correo: lead.correo || "",
      whatsapp: lead.whatsapp || "",
      plan: lead.plan || "",
      precio: lead.precio || 0,
      estado_pago: "approved",
      estado_activacion: "pendiente",
      fecha_pago: new Date().toISOString(),
      origen: "manual"
    }
  );

  await deleteDoc(
    doc(db,"leads",id)
  );

  alert("Lead convertido en cliente");

  cargar();

}


  await updateDoc(
    doc(db,tipo === "lead" ? "leads":"clientes",id),
    {
      estado:"contactado"
    }
  );

  cargar();

}

window.eliminar = async function(id,tipo){

  const ok =
  confirm("¿Eliminar registro?");

  if(!ok) return;

  await deleteDoc(
    doc(db,tipo === "lead" ? "leads":"clientes",id)
  );

  cargar();

}

document
.getElementById("busqueda")
.addEventListener("input",render);

document
.getElementById("filtro")
.addEventListener("change",render);

cargar();

</script>

</body>
</html>
