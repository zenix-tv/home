<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin PATAN TV</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050b16;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding:24px;
}

h1{text-align:center;color:#FFA100;margin-bottom:8px}
.subtitle{text-align:center;color:#cbd5e1;margin-bottom:26px;font-size:14px}

.panel{max-width:1300px;margin:auto}

.topbar{
  display:flex;
  gap:12px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.search{flex:1;min-width:240px}

.search input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,161,0,.35);
  background:#111827;
  color:#fff;
}

.card{
  background:#111827;
  border:1px solid rgba(255,161,0,.35);
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 0 25px rgba(255,161,0,.12);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

  .stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  margin-bottom:22px;
}

.stat-card{
  background:#111827;
  border:1px solid rgba(255,161,0,.35);
  border-radius:18px;
  padding:18px;
  box-shadow:0 0 20px rgba(255,161,0,.12);
}

.stat-title{
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:10px;
}

.stat-value{
  font-size:34px;
  font-weight:900;
  color:#FFA100;
}
.label{color:#FFA100;font-weight:900;margin-bottom:4px}

input,textarea{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid rgba(255,161,0,.35);
  background:#000;
  color:#fff;
}

textarea{
  min-height:92px;
  resize:vertical;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.35;
}

button,a.btn{
  display:inline-block;
  margin-top:12px;
  padding:12px 16px;
  border-radius:12px;
  background:#FFA100;
  color:#000;
  border:none;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  margin-right:8px;
}

button:hover,a.btn:hover{filter:brightness(1.1)}

.delete{background:#7f1d1d;color:#fff}
.contactado{background:#14532d;color:#fff}
.access{background:#2563eb;color:#fff}
.convertir{background:#9333ea;color:#fff}
.whatsapp{background:#22c55e;color:#04130a}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-weight:900;
  text-transform:uppercase;
  font-size:12px;
}

.pendiente{background:#7c2d12;color:#fff}
.activado{background:#14532d;color:#fff}
.lead{background:#1d4ed8;color:#fff}
.contactado-status,.contactado{background:#166534;color:#fff}
.approved,.pagado{background:#14532d;color:#fff}

.small{color:#ccc;font-size:14px;word-break:break-word}
.empty{padding:30px;text-align:center;color:#cbd5e1;border:1px dashed rgba(255,161,0,.35);border-radius:18px}

hr{
  border-color:rgba(255,255,255,.1);
  margin:18px 0;
}

@media(max-width:640px){
  body{padding:14px}
  button,a.btn{width:100%;text-align:center;margin-right:0}
}
</style>
</head>

<body>

<script>
if(localStorage.getItem("patan_admin") !== "ok"){
  window.location.href = "/admin-login.html";
}
</script>

<div class="panel">

<h1>Panel Admin PATAN TV</h1>
<div class="subtitle">Clientes · Leads · Activación · WhatsApp Business</div>

<div id="stats" class="stats-grid"></div>
<div class="topbar">
  <div class="search">
    <input type="text" id="busqueda" placeholder="Buscar cliente, correo o WhatsApp...">
  </div>

  <div style="width:240px">
    <select id="filtro">
      <option value="todos">Todos</option>
      <option value="lead">Leads</option>
      <option value="approved">Pagados</option>
      <option value="activado">Activados</option>
      <option value="pendiente">Pendientes</option>
      <option value="contactado">Contactados</option>
    </select>
  </div>
</div>

<div id="clientes"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgK8LvJS69gyEhiUL7U-6AQoKBwyq-Pfs",
  authDomain: "patan-tv.firebaseapp.com",
  projectId: "patan-tv",
  storageBucket: "patan-tv.firebasestorage.app",
  messagingSenderId: "400945997953",
  appId: "1:400945997953:web:c5721123411dad95c08580"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const contenedor = document.getElementById("clientes");
const inputBusqueda = document.getElementById("busqueda");
const selectFiltro = document.getElementById("filtro");
const stats = document.getElementById("stats");

let TODOS = [];

function escapeHTML(valor){
  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function limpiarTelefonoWhatsApp(numero){
  let tel = String(numero || "").replace(/\D/g,"");

  if(!tel) return "";

  // Chile: si viene como 9 dígitos empezando en 9, agregamos 56.
  if(tel.length === 9 && tel.startsWith("9")) return "56" + tel;

  // España: si viene como 9 dígitos empezando en 6, 7, 8 o 9, agregamos 34.
  if(tel.length === 9 && /^[6789]/.test(tel)) return "34" + tel;

  // Si ya viene con código país, lo respetamos.
  return tel;
}

function abrirWhatsAppBusiness(numero, mensaje){
  const telefonoFinal = limpiarTelefonoWhatsApp(numero);

  if(!telefonoFinal){
    alert("Este cliente no tiene WhatsApp válido.");
    return;
  }

  const texto = encodeURIComponent(mensaje);
  const esAndroid = /Android/i.test(navigator.userAgent);

  // Android intenta abrir específicamente WhatsApp Business.
  if(esAndroid){
    window.location.href = `intent://send?phone=${telefonoFinal}&text=${texto}#Intent;scheme=whatsapp;package=com.whatsapp.w4b;end`;
    return;
  }

  // PC/iPhone fallback: abre WhatsApp Web/App normal.
  window.open(`https://wa.me/${telefonoFinal}?text=${texto}`, "_blank");
}

function obtenerEstado(c){
  if(c.tipo === "lead") return c.estado || "lead";
  return c.estado_activacion || c.estado_pago || c.estado || "pendiente";
}

function obtenerClaseEstado(estado){
  if(estado === "contactado") return "contactado-status";
  if(estado === "approved") return "approved";
  return estado || "pendiente";
}
  
function normalizarTexto(valor){
  return String(valor || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}
async function cargar(){
  TODOS = [];

  const clientesSnap = await getDocs(collection(db,"clientes"));
  clientesSnap.forEach(docu => {
    TODOS.push({
      id:docu.id,
      tipo:"cliente",
      ...docu.data()
    });
  });

  const leadsSnap = await getDocs(collection(db,"leads"));
  leadsSnap.forEach(docu => {
    TODOS.push({
      id:docu.id,
      tipo:"lead",
      ...docu.data()
    });
  });

function renderStats(){

  const leads =
  TODOS.filter(x => x.tipo === "lead").length;

  const pagados =
  TODOS.filter(x =>
    x.estado_pago === "approved" ||
    x.estado_pago === "pagado"
  ).length;

  const activados =
  TODOS.filter(x =>
    x.estado_activacion === "activado"
  ).length;

  const pendientes =
  TODOS.filter(x =>
    x.estado_activacion === "pendiente"
  ).length;

  stats.innerHTML = `

    <div class="stat-card">
      <div class="stat-title">🔥 Leads</div>
      <div class="stat-value">${leads}</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">💰 Pagados</div>
      <div class="stat-value">${pagados}</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">✅ Activados</div>
      <div class="stat-value">${activados}</div>
    </div>

    <div class="stat-card">
      <div class="stat-title">⏳ Pendientes</div>
      <div class="stat-value">${pendientes}</div>
    </div>

  `;
}
 renderStats();
render();
}

function render(){
  const texto = normalizarTexto(inputBusqueda.value);
const textoNumerico = String(inputBusqueda.value || "").replace(/\D/g,"");
  const filtro = selectFiltro.value;

  contenedor.innerHTML = "";

  const filtrados = TODOS.filter(c => {
    const estado = obtenerEstado(c);

 const textoCliente = normalizarTexto(`
  ${c.nombre || ""}
  ${c.correo || ""}
  ${c.whatsapp || ""}
  ${c.telefono || ""}
  ${c.plan || ""}
  ${c.estado || ""}
  ${c.estado_pago || ""}
  ${c.estado_activacion || ""}
  ${c.observaciones || ""}
`);

const telefonoCliente = String(c.whatsapp || c.telefono || "").replace(/\D/g,"");

const matchTexto =
  !texto ||
  textoCliente.includes(texto) ||
  (textoNumerico && telefonoCliente.includes(textoNumerico));

    let matchFiltro = true;

    if(filtro === "lead") matchFiltro = c.tipo === "lead";
    if(filtro === "approved") matchFiltro = c.estado_pago === "approved" || c.estado_pago === "pagado";
    if(filtro === "activado") matchFiltro = c.estado_activacion === "activado";
    if(filtro === "pendiente") matchFiltro = c.estado_activacion === "pendiente";
    if(filtro === "contactado") matchFiltro = estado === "contactado" || c.estado === "contactado";

    return matchTexto && matchFiltro;
  });

  if(filtrados.length === 0){
    contenedor.innerHTML = `<div class="empty">No hay registros para este filtro.</div>`;
    return;
  }

  filtrados.forEach(c => {
    const estado = obtenerEstado(c);
    const claseEstado = obtenerClaseEstado(estado);

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="grid">
        <div>
          <div class="label">Cliente</div>
          ${escapeHTML(c.nombre || "")}
        </div>

        <div>
          <div class="label">Correo</div>
          ${escapeHTML(c.correo || "")}
        </div>

        <div>
          <div class="label">WhatsApp</div>
          ${escapeHTML(c.whatsapp || "")}
        </div>

        <div>
          <div class="label">Plan</div>
          ${escapeHTML(c.plan || "")}
        </div>

        <div>
          <div class="label">Precio</div>
          $${Number(c.precio || 0).toLocaleString("es-CL")}
        </div>

        <div>
          <div class="label">Estado</div>
          <span class="status ${escapeHTML(claseEstado)}">${escapeHTML(estado)}</span>
        </div>
      </div>

      <hr>

      <div class="grid">
        <div>
          <div class="label">Usuario IPTV</div>
          <input id="u-${c.id}" value="${escapeHTML(c.usuario_iptv || "")}" ${c.tipo === "lead" ? "disabled" : ""}>
        </div>

        <div>
          <div class="label">Password IPTV</div>
          <input id="p-${c.id}" value="${escapeHTML(c.password_iptv || "")}" ${c.tipo === "lead" ? "disabled" : ""}>
        </div>

        <div>
          <div class="label">Link M3U</div>
          <input id="m-${c.id}" value="${escapeHTML(c.m3u || "")}" ${c.tipo === "lead" ? "disabled" : ""}>
        </div>
      </div>

      <div style="margin-top:14px">
        <div class="label">Observaciones / Gestión interna</div>
        <textarea id="obs-${c.id}" placeholder="Ej: Cliente pidió ayuda para instalar en TV Box, renovar el día 15, pendiente enviar APK, problema técnico, seguimiento comercial...">${escapeHTML(c.observaciones || "")}</textarea>
      </div>

      <div class="acciones">
        ${c.tipo === "cliente" ? `
          <button onclick="activar('${c.id}')">Guardar acceso</button>
          <button class="access" onclick="enviarAcceso('${c.id}')">Enviar hoja de acceso</button>
        ` : ""}

        ${c.tipo === "lead" ? `
          <button class="whatsapp" onclick="contactarLead('${c.id}')">WhatsApp Lead</button>
          <button class="convertir" onclick="convertirCliente('${c.id}')">Pasar a Pagado / Contratado</button>
        ` : ""}

        <button onclick="guardarObservacion('${c.id}','${c.tipo}')">Guardar observación</button>
        <button class="contactado" onclick="marcarContactado('${c.id}','${c.tipo}')">Marcar contactado</button>
        <button class="delete" onclick="eliminar('${c.id}','${c.tipo}')">Eliminar</button>
      </div>

      <p class="small">${escapeHTML(c.payment_id || "")}</p>
    `;

    contenedor.appendChild(div);
  });
}

window.activar = async function(id){
  const usuario = document.getElementById("u-"+id)?.value.trim() || "";
  const password = document.getElementById("p-"+id)?.value.trim() || "";
  const m3u = document.getElementById("m-"+id)?.value.trim() || "";

  if(!usuario || !password || !m3u){
    alert("Debes completar usuario, contraseña y M3U antes de activar.");
    return;
  }

  await updateDoc(doc(db,"clientes",id),{
    usuario_iptv:usuario,
    password_iptv:password,
    m3u:m3u,
    estado_activacion:"activado",
    actualizado_en:new Date().toISOString()
  });

  alert("Cliente activado y acceso guardado.");
  cargar();
};

window.enviarAcceso = function(id){
  const c = TODOS.find(x => x.id === id && x.tipo === "cliente");

  if(!c){
    alert("No encontré este cliente.");
    return;
  }

  const usuario = document.getElementById("u-"+id)?.value.trim() || c.usuario_iptv || "";
  const password = document.getElementById("p-"+id)?.value.trim() || c.password_iptv || "";
  const m3u = document.getElementById("m-"+id)?.value.trim() || c.m3u || "";

  if(!usuario || !password || !m3u){
    alert("Primero completa y guarda usuario, contraseña y M3U.");
    return;
  }

  const accesoURL =
    "https://www.patan.tv/acceso-patan.html" +
    "?nombre=" + encodeURIComponent(c.nombre || "") +
    "&plan=" + encodeURIComponent(c.plan || "") +
    "&usuario=" + encodeURIComponent(usuario) +
    "&password=" + encodeURIComponent(password) +
    "&m3u=" + encodeURIComponent(m3u);

  const mensaje = `Hola ${c.nombre || "Patán Premium"} 😎🔥

🎉 ¡Bienvenido a PATAN TV!

Tu cuenta ya está activa y lista para disfrutar.

📦 Plan contratado: ${c.plan || ""}
👤 Usuario: ${usuario}
🔑 Contraseña: ${password}

🔗 Link M3U:
${m3u}

📄 Tu hoja de acceso premium:
${accesoURL}

Guarda esta página. Ahí encontrarás tus datos, apps recomendadas e instrucciones de instalación.

Si necesitas ayuda, estamos para apoyarte.
PATAN TV 🐶🔥`;

  abrirWhatsAppBusiness(c.whatsapp, mensaje);
};

window.contactarLead = function(id){
  const c = TODOS.find(x => x.id === id && x.tipo === "lead");

  if(!c){
    alert("No encontré este lead.");
    return;
  }

  const mensaje = `Hola ${c.nombre || ""} 😎

Soy de PATAN TV 🐶🔥

Vimos que mostraste interés en el plan ${c.plan || ""}.

¿Te ayudo a activar tu cuenta premium ahora?`;

  abrirWhatsAppBusiness(c.whatsapp, mensaje);
};

window.convertirCliente = async function(id){
  const lead = TODOS.find(x => x.id === id && x.tipo === "lead");

  if(!lead){
    alert("Lead no encontrado.");
    return;
  }

  const ok = confirm("¿Confirmas que este lead ya pagó y quieres moverlo a Pagados/Clientes?");
  if(!ok) return;

  await addDoc(collection(db,"clientes"),{
    nombre: lead.nombre || "",
    correo: lead.correo || "",
    whatsapp: lead.whatsapp || "",
    plan: lead.plan || "",
    precio: lead.precio || 0,
    estado_pago: "approved",
    estado_activacion: "pendiente",
    fecha_pago: new Date().toISOString(),
    origen: "lead_convertido_manual",
    payment_id: lead.payment_id || "",
    observaciones: lead.observaciones || ""
  });

  await deleteDoc(doc(db,"leads",id));

  alert("Lead convertido en cliente pagado. Ahora puedes cargar usuario, contraseña y M3U.");
  cargar();
};

window.guardarObservacion = async function(id,tipo){
  const coleccion = tipo === "lead" ? "leads" : "clientes";
  const observaciones = document.getElementById("obs-"+id)?.value.trim() || "";

  await updateDoc(doc(db,coleccion,id),{
    observaciones,
    fecha_ultima_observacion:new Date().toISOString()
  });

  alert("Observación guardada correctamente.");
  cargar();
};

window.marcarContactado = async function(id,tipo){
  const coleccion = tipo === "lead" ? "leads" : "clientes";

  await updateDoc(doc(db,coleccion,id),{
    estado:"contactado",
    contactado_en:new Date().toISOString()
  });

  alert("Registro marcado como contactado.");
  cargar();
};

window.eliminar = async function(id,tipo){
  const ok = confirm("¿Eliminar registro definitivamente?");
  if(!ok) return;

  await deleteDoc(doc(db,tipo === "lead" ? "leads" : "clientes",id));
  cargar();
};

inputBusqueda.addEventListener("input",render);
selectFiltro.addEventListener("change",render);

cargar();
</script>

</body>
</html>
